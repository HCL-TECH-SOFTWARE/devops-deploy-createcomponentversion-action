name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate action.yml
        # actionlint only checks workflows, so parse the action metadata and check required keys
        run: |
          python3 - <<'EOF'
          import sys, yaml
          action = yaml.safe_load(open("action.yml"))
          allowed = {"description", "required", "default", "deprecationMessage"}
          errors = [f"input '{name}' has unsupported key(s): {sorted(set(spec) - allowed)}"
                    for name, spec in action["inputs"].items() if set(spec) - allowed]
          if action["runs"]["using"] != "composite":
              errors.append("runs.using must be composite")
          for step in action["runs"]["steps"]:
              if "run" in step and "shell" not in step:
                  errors.append(f"step '{step.get('name')}' is missing shell")
          print("\n".join(errors) or "action.yml OK")
          sys.exit(1 if errors else 0)
          EOF
      - name: Run actionlint on workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
